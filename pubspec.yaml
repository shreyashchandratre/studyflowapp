name: studyflowapp
description: "StudyFlow — AI-powered study companion with Firebase backend."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI / Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Networking (Cerebras API)
  http: ^1.2.2

  # PDF parsing (on-device)
  syncfusion_flutter_pdf: ^26.2.14

  # File picking
  file_picker: ^8.1.2

  # Local storage / offline cache
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
